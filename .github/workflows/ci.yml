name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  emulator:
    name: Emulator and Forth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install RISC-V tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-linux-gnu gcc-riscv64-linux-gnu cmake

      - name: Build core
        run: scripts/build-core.sh build/core

      - name: Build emulator
        run: |
          cmake -S emu -B build/emu -DCMAKE_BUILD_TYPE=Release
          cmake --build build/emu -j

      - name: Fetch riscv-tests
        uses: actions/checkout@v5
        with:
          repository: riscv-software-src/riscv-tests
          ref: 3df703cd52d5f0d8224e3c50bf03c6cb70efff98
          path: riscv-tests
          submodules: true

      - name: RISC-V ISA tests
        run: tests/riscv/run.sh riscv-tests build/emu/isa-runner build/isa

      - name: Forth tests
        run: tests/forth/run.sh build/emu/qpemu build/core/core.bin build/forth build/core/core.syms

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-linux-gnu

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: mecrisp-pocket-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A signed release APK when the signing secrets are set (see README).
      # Pull requests from forks get no secrets and skip it.
      - name: Release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::notice::No SIGNING_KEYSTORE_BASE64 secret; the release APK stays unsigned. See README."
          fi

      # Built on every run, so R8 problems show up early; unsigned without
      # the secrets, and then not uploaded.
      - name: Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          [ -n "$SIGNING_KEYSTORE" ] || exit 0
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/mecrisp-pocket.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs out/mecrisp-pocket.apk

      - uses: actions/upload-artifact@v5
        if: env.SIGNING_KEYSTORE != ''
        with:
          name: mecrisp-pocket-release
          path: out/mecrisp-pocket.apk
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [emulator, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: mecrisp-pocket-release
          path: out

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/mecrisp-pocket.apk "out/mecrisp-pocket-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" out/*.apk -R "$GITHUB_REPOSITORY" \
            --title "Mecrisp Pocket $GITHUB_REF_NAME" --generate-notes
