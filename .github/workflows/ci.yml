name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  emulator:
    name: Emulator and Forth tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install RISC-V tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-linux-gnu gcc-riscv64-linux-gnu cmake

      - name: Build core
        run: scripts/build-core.sh build/core

      - name: Build emulator
        run: |
          cmake -S emu -B build/emu -DCMAKE_BUILD_TYPE=Release
          cmake --build build/emu -j

      - name: Fetch riscv-tests
        uses: actions/checkout@v5
        with:
          repository: riscv-software-src/riscv-tests
          ref: 3df703cd52d5f0d8224e3c50bf03c6cb70efff98
          path: riscv-tests
          submodules: true

      - name: RISC-V ISA tests
        run: tests/riscv/run.sh riscv-tests build/emu/isa-runner build/isa

      - name: Forth tests
        run: tests/forth/run.sh build/emu/qpemu build/core/core.bin build/forth

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install RISC-V binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-linux-gnu

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: mecrisp-pocket-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
